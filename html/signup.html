<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <title>Create Account - Mappoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/signup.css"/>
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <img alt="Map App Logo" class="brand-logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtzhFAQawQ_9jbVDIQEsitr-ssCNjfhzsoz2pTD0yuyqCBy74UpJwL2zkO9e9GcZBds3swi3Y_TmsAlKwgMjjrR8XDKn3ggy2JWJtgReZnD3AVzNlxi0QHt1x1mRkAcuUamUi0cVUM355RtaOYqFF2RUWRWG-bPJBzZaVEmq8vp9kRxYxHGj2ZpQjdaXAW1geYAwiinSJODcjH_3lZNDVb6hCxJ5sd4v5peANn_0Uyz_EjknJsVeNpQQ"/>
                <span class="brand-title">Explore</span>
            </div>
            <div class="user-avatar">
                <span class="material-symbols-outlined icon">person</span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="page-container">
            <div class="auth-card">
                <!-- Header -->
                <div class="auth-header">
                    <div class="app-icon-wrapper">
                        <div class="app-icon-hover"></div>
                        <img alt="MAPPOINT Logo" onclick="window.location.href='home.html'" class="app-icon" src="https://lh3.googleusercontent.com/aida/AP1WRLtNDp5iBMCqX8CQGZAq3D7I9DOcVq9NQN4xalchpStP1R1h88KavIZEZowi_sXK08j3wnwNCtmCtm86Rr2eMZ29RRdfYp_mgMFKyekTkDhsyp7EqNK6J3F2eocTbQwo4sbrS8Rhi_sUzBV9DpdRNCLIGpF1Tn0AtP5-knSJGgUso3DhJIe-AHU0RoDab0zxAg_Izp7SEPyYUyqkkBChdGyXbmEWbpERZQMHLno7W-KbHvFLCkltIYGs2NVP"/>
                    </div>
                    <h1 class="auth-title">Create Account</h1>
                    <p class="auth-subtitle">Join Mappoint to explore the world.</p>
                </div>

                <!-- Form -->
                <form class="auth-form" id="signup-form">
                    <div class="form-group">
                        <label class="form-label" for="fullName">Full Name</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">person</span>
                            <input class="form-input" id="fullName" placeholder="John Doe" type="text"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">mail</span>
                            <input class="form-input" id="email" placeholder="john@example.com" type="email"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">lock</span>
                            <input class="form-input pr-button" id="password" placeholder="••••••••" type="password"/>
                            <button class="toggle-password-btn" id="toggle-password" type="button">
                                <span class="material-symbols-outlined">visibility_off</span>
                            </button>
                        </div>
                    </div>

                    <label class="checkbox-container">
                        <input class="checkbox-input" type="checkbox"/>
                        <div class="checkbox-custom">
                            <span class="material-symbols-outlined check-icon">check</span>
                        </div>
                        <span class="checkbox-text">
                            I agree to the <a class="inline-link" href="#">Terms of Service</a> &amp; <a class="inline-link" href="#">Privacy Policy</a>
                        </span>
                    </label>

                    <button class="btn-primary" type="submit">
                        <span class="btn-text">Sign Up</span>
                        <span class="material-symbols-outlined btn-icon">arrow_forward</span>
                        <div class="btn-hover-effect"></div>
                    </button>
                </form>

                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">or continue with</span>
                    <div class="divider-line"></div>
                </div>

                <div class="social-buttons">
                    <button class="btn-social">
                        <svg class="social-svg" fill="currentColor" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
                        Sign up with Google
                    </button>
                    <button class="btn-social">
                        <svg class="social-svg text-white" fill="currentColor" viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"></path></svg>
                        Sign up with Apple
                    </button>
                </div>

                <div class="auth-footer">
                    <span class="footer-text">Already have an account? </span>
                    <a class="footer-link" href="signin.html">Log in</a>
                </div>
            </div>
        </div>
    </main>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        
        if (toggleBtn && passwordInput) {
          toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = toggleBtn.querySelector('.material-symbols-outlined');
            icon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
            icon.classList.add('scale-icon');
            setTimeout(() => icon.classList.remove('scale-icon'), 150);
          });
        }

        const inputs = document.querySelectorAll('input:not([type="checkbox"])');
        inputs.forEach(input => {
          input.addEventListener('focus', (e) => {
            const icon = e.target.parentElement.querySelector('.input-icon');
            if(icon) icon.classList.add('active');
          });
          input.addEventListener('blur', (e) => {
            const icon = e.target.parentElement.querySelector('.input-icon');
            if(icon) icon.classList.remove('active');
          });
        });
      });
    </script>
</body>
</html>
