<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <title>Home - Mappoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hanken+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="stylesheet" href="/CSS/home.css"/>
    <script type="module" src="/JS/home.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="header-inner">
        <div class="header-brand">
            <img alt="Map App Logo" class="brand-logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtzhFAQawQ_9jbVDIQEsitr-ssCNjfhzsoz2pTD0yuyqCBy74UpJwL2zkO9e9GcZBds3swi3Y_TmsAlKwgMjjrR8XDKn3ggy2JWJtgReZnD3AVzNlxi0QHt1x1mRkAcuUamUi0cVUM355RtaOYqFF2RUWRWG-bPJBzZaVEmq8vp9kRxYxHGj2ZpQjdaXAW1geYAwiinSJODcjH_3lZNDVb6hCxJ5sd4v5peANn_0Uyz_EjknJsVeNpQQ">
            <span class="brand-title">Explore</span>
        </div>

        <!-- User Avatar Trigger -->
        <div class="user-trigger" id="user-menu-trigger">
            <span class="material-symbols-outlined">person</span>
        </div>

        <!-- User Dropdown Menu -->
        <div class="user-dropdown hidden" id="user-dropdown">
            <div class="dropdown-header">
            <div class="user-avatar-wrap">
                <img alt="User Avatar" id="user-avatar" class="user-avatar-img" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtzhFAQawQ_9jbVDIQEsitr-ssCNjfhzsoz2pTD0yuyqCBy74UpJwL2zkO9e9GcZBds3swi3Y_TmsAlKwgMjjrR8XDKn3ggy2JWJtgReZnD3AVzNlxi0QHt1x1mRkAcuUamUi0cVUM355RtaOYqFF2RUWRWG-bPJBzZaVEmq8vp9kRxYxHGj2ZpQjdaXAW1geYAwiinSJODcjH_3lZNDVb6hCxJ5sd4v5peANn_0Uyz_EjknJsVeNpQQ">
            </div>
            <div class="user-info">
                <span class="user-name" id="user-name">John Doe</span>
                <span class="user-email" id="user-email">john@example.com</span>
            </div>
            </div>
            <div class="dropdown-body"></div>
            <div class="dropdown-footer">
            <button class="logout-action-btn" id="logout-button">
                <span class="material-symbols-outlined">logout</span>
                <span>Đăng xuất</span>
            </button>
            </div>
        </div>
        </div>
    </header>

    <main class="main-content">
        <div class="splash-container">
            <div class="map-bg"></div>
            <div class="gradient-overlay"></div>

            <div class="hero-content">
                <div class="pulse-logo-wrapper">
                    <img alt="Mappoint Logo" class="pulse-logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtzhFAQawQ_9jbVDIQEsitr-ssCNjfhzsoz2pTD0yuyqCBy74UpJwL2zkO9e9GcZBds3swi3Y_TmsAlKwgMjjrR8XDKn3ggy2JWJtgReZnD3AVzNlxi0QHt1x1mRkAcuUamUi0cVUM355RtaOYqFF2RUWRWG-bPJBzZaVEmq8vp9kRxYxHGj2ZpQjdaXAW1geYAwiinSJODcjH_3lZNDVb6hCxJ5sd4v5peANn_0Uyz_EjknJsVeNpQQ"/>
                </div>
                <h1 class="hero-title">MAPPOINT</h1>
                <p class="hero-subtitle">Navigate the world with precision.</p>
            </div>

            <div class="action-buttons">
                <button class="btn-primary" id="letgo">
                    <span class="material-symbols-outlined icon-20">explore</span>
                    START EXPLORING
                </button>
                <div class="button-row">
                    <button class="btn-outline" id="signin-button">LOG IN</button>
                    <button class="btn-secondary" id="signup-button">SIGN UP</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
